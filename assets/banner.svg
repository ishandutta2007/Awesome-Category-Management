<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGlow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient></defs><style>@keyframes pulse-bar{0%{transform:scaleY(1);opacity:.7}50%{transform:scaleY(1.25);opacity:1}}@keyframes float-pill{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:800;font-size:52px;fill:#fff}.subtitle{font-weight:400;font-size:20px;fill:#94a3b8}.badge-text{font-weight:600;font-size:14px;fill:#e2e8f0}.bar1{animation:pulse-bar 3s infinite ease-in-out 0s}.bar1,.bar2,.bar3,.bar4{transform-origin:bottom}.bar2{animation:pulse-bar 3s infinite ease-in-out .6s}.bar3{animation:pulse-bar 3s infinite ease-in-out 1.2s}.bar4{animation:pulse-bar 3s infinite ease-in-out 1.8s}.pill1{animation:float-pill 4s infinite ease-in-out 0s}.pill2{animation:float-pill 4s infinite ease-in-out 2s}.flow-line{stroke-dasharray:8 8;animation:dash 2s linear infinite}</style><rect width="1200" height="350" fill="url(#bgGlow)" rx="16"/><rect width="1196" height="346" x="2" y="2" fill="none" stroke="url(#accentGrad)" stroke-opacity=".3" stroke-width="1.5" rx="14"/><g opacity=".25"><line x1="50" x2="1150" y1="280" y2="280" stroke="#334155" stroke-width="1"/><line x1="50" x2="1150" y1="220" y2="220" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/><line x1="50" x2="1150" y1="160" y2="160" stroke="#334155" stroke-dasharray="4 4" stroke-width="1"/></g><g transform="translate(820, 60)"><rect width="320" height="230" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" rx="12"/><text x="20" y="35" fill="#6366f1" class="badge-text">📊 Category Growth &amp; Space</text><rect width="36" height="80" x="30" y="110" fill="#6366f1" class="bar1" rx="4"/><rect width="36" height="110" x="85" y="80" fill="#8b5cf6" class="bar2" rx="4"/><rect width="36" height="60" x="140" y="130" fill="#ec4899" class="bar3" rx="4"/><rect width="36" height="130" x="195" y="60" fill="#10b981" class="bar4" rx="4"/><path fill="none" stroke="#f43f5e" stroke-width="3" d="M 48 110 L 103 80 L 158 130 L 213 60 L 270 40" class="flow-line"/></g><g class="pill1" transform="translate(60, 45)"><rect width="180" height="34" fill="#1e293b" stroke="#6366f1" stroke-width="1" rx="17"/><text x="90" y="22" class="badge-text" text-anchor="middle">🛒 Assortment Planning</text></g><g class="pill2" transform="translate(255, 45)"><rect width="170" height="34" fill="#1e293b" stroke="#a855f7" stroke-width="1" rx="17"/><text x="85" y="22" class="badge-text" text-anchor="middle">📐 Planogram &amp; Space</text></g><g class="pill1" transform="translate(440, 45)"><rect width="160" height="34" fill="#1e293b" stroke="#ec4899" stroke-width="1" rx="17"/><text x="80" y="22" class="badge-text" text-anchor="middle">📈 Retail Analytics</text></g><g><text x="0" y="0" class="title" transform="translate(60, 150)">Awesome <tspan fill="url(#accentGrad)">Category Management</tspan></text><text x="0" y="42" class="subtitle" transform="translate(60, 150)">Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; Retail Optimization Frameworks</text><g transform="translate(60, 150) translate(0, 80)"><rect width="140" height="28" fill="#334155" opacity=".6" rx="6"/><text x="70" y="19" fill="#cbd5e1" class="badge-text" text-anchor="middle">⚡ Retail SaaS</text><rect width="160" height="28" x="150" y="0" fill="#334155" opacity=".6" rx="6"/><text x="230" y="19" fill="#cbd5e1" class="badge-text" text-anchor="middle">🔓 Open-Source MILP</text><rect width="170" height="28" x="320" y="0" fill="#334155" opacity=".6" rx="6"/><text x="405" y="19" fill="#cbd5e1" class="badge-text" text-anchor="middle">🎯 Choice Modeling</text></g></g></svg>