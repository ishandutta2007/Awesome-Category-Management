<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

    /* Keyframe Animations */
    @keyframes pulse-bar {
      0%, 100% { transform: scaleY(1); opacity: 0.7; }
      50% { transform: scaleY(1.25); opacity: 1; }
    }
    @keyframes float-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .bar1 { transform-origin: bottom; animation: pulse-bar 3s infinite ease-in-out 0s; }
    .bar2 { transform-origin: bottom; animation: pulse-bar 3s infinite ease-in-out 0.6s; }
    .bar3 { transform-origin: bottom; animation: pulse-bar 3s infinite ease-in-out 1.2s; }
    .bar4 { transform-origin: bottom; animation: pulse-bar 3s infinite ease-in-out 1.8s; }

    .pill1 { animation: float-pill 4s infinite ease-in-out 0s; }
    .pill2 { animation: float-pill 4s infinite ease-in-out 2s; }

    .flow-line { stroke-dasharray: 8 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGlow)"/>
  <rect width="1196" height="346" x="2" y="2" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Dynamic Background Grid / Analytics Visuals -->
  <g opacity="0.25">
    <line x1="50" y1="280" x2="1150" y2="280" stroke="#334155" stroke-width="1"/>
    <line x1="50" y1="220" x2="1150" y2="220" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="50" y1="160" x2="1150" y2="160" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  </g>

  <!-- Right Side Visuals: Interactive Analytics & Shelf Allocation Graphic -->
  <g transform="translate(820, 60)">
    <rect width="320" height="230" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="35" class="badge-text" fill="#6366f1">📊 Category Growth &amp; Space</text>
    
    <!-- Animated Chart Bars -->
    <rect class="bar1" x="30" y="110" width="36" height="80" rx="4" fill="#6366f1"/>
    <rect class="bar2" x="85" y="80" width="36" height="110" rx="4" fill="#8b5cf6"/>
    <rect class="bar3" x="140" y="130" width="36" height="60" rx="4" fill="#ec4899"/>
    <rect class="bar4" x="195" y="60" width="36" height="130" rx="4" fill="#10b981"/>
    
    <!-- Flow line over bars -->
    <path class="flow-line" d="M 48 110 L 103 80 L 158 130 L 213 60 L 270 40" fill="none" stroke="#f43f5e" stroke-width="3"/>
  </g>

  <!-- Floating Feature Pills -->
  <g class="pill1" transform="translate(60, 45)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <text x="90" y="22" class="badge-text" text-anchor="middle">🛒 Assortment Planning</text>
  </g>

  <g class="pill2" transform="translate(255, 45)">
    <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
    <text x="85" y="22" class="badge-text" text-anchor="middle">📐 Planogram &amp; Space</text>
  </g>

  <g class="pill1" transform="translate(440, 45)">
    <rect width="160" height="34" rx="17" fill="#1e293b" stroke="#ec4899" stroke-width="1"/>
    <text x="80" y="22" class="badge-text" text-anchor="middle">📈 Retail Analytics</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 150)">
    <text x="0" y="0" class="title">
      Awesome <tspan fill="url(#accentGrad)">Category Management</tspan>
    </text>
    <text x="0" y="42" class="subtitle">
      Curated Ecosystem of SaaS Platforms, Open-Source Tools &amp; Retail Optimization Frameworks
    </text>

    <!-- Sub-Badges / Quick Info -->
    <g transform="translate(0, 80)">
      <rect width="140" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="70" y="19" class="badge-text" text-anchor="middle" fill="#cbd5e1">⚡ Retail SaaS</text>
      
      <rect x="150" y="0" width="160" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="230" y="19" class="badge-text" text-anchor="middle" fill="#cbd5e1">🔓 Open-Source MILP</text>

      <rect x="320" y="0" width="170" height="28" rx="6" fill="#334155" opacity="0.6"/>
      <text x="405" y="19" class="badge-text" text-anchor="middle" fill="#cbd5e1">🎯 Choice Modeling</text>
    </g>
  </g>
</svg>
